<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Advanced Voice Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🤖 Advanced Voice Assistant</h1>

        <p class="subtitle">
            Your Personal Voice Assistant
        </p>

        <!-- Assistant Circle -->
        <div class="assistant">
            🎙️
        </div>

        <!-- Status -->
        <p id="status">
            Click the microphone and speak
        </p>

        <!-- Voice Button -->
        <button id="micBtn">
            🎤 Start Listening
        </button>

        <!-- User Command -->
        <div class="box">
            <h3>You Said</h3>

            <p id="userText">
                Nothing yet...
            </p>
        </div>

        <!-- Assistant Response -->
        <div class="box">
            <h3>Assistant</h3>

            <p id="assistantText">
                Hello! How can I help you?
            </p>
        </div>

        <!-- Text Command -->
        <div class="input-area">

            <input
                type="text"
                id="commandInput"
                placeholder="Type your command..."
            >

            <button id="sendBtn">
                Send
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
